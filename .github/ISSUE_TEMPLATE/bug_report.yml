name: 问题反馈
description: 报告应用使用中遇到的问题
body:
  - type: markdown
    attributes:
      value: 请不要上传数据库、学习备份、同步密码、访问令牌或包含个人信息的截图。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 系统版本与设备型号
      description: 例如 Android 14 / 手机型号，或 Windows 11 / x64 电脑。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 从哪个页面开始，做了哪些操作？语音问题请补充音色与外部引擎版本。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与期望结果
    validations:
      required: true
